            {
                id: 11,
                contexto: "Gabriel, profissional C-PRO I, está analisando ativos para uma carteira recomendada de crédito privado de sua instituição. Essa carteira inclui títulos corporativos expostos ao setor de energia. Diante de um cenário de queda nos preços de commodities e pressões inflacionárias, Gabriel precisa reavaliar o risco de crédito dos ativos. A carteira possui:\nTítulo X: Debênture da Empresa Ômega (rating BBB, yield 11,5% a.a., duration 4 anos);\nTítulo Y: Debênture da Empresa Sigma (rating AA, yield 8,2% a.a., duration 3 anos);\nTítulo Z: Letra Financeira de banco médio (rating A, yield 10,0% a.a.,duration 2 anos).\nDados adicionais:\nA taxa livre de risco é 6,5% a.a.;\nO CDS (Credit Default Swap) do setor de energia subiu 120 pb nos últimos 3 meses;\nA Ômega possui alto endividamento (D/E = 2,5), enquanto a Sigma tem D/E = 0,8.",

            {
                id: 12,
                contexto: "Guilherme, profissional C-PRO I, deve emitir diretrizes para as carteiras recomendadas de ações, distribuídas por profissionais C-Pro R, com exposição temática a small caps. Nas últimas 4 semanas, houve queda de 25% no Volume Médio Diário das posições do universo cobertura, alargamento do spread médio de 0,7% para 2,0% e sinais de deterioração fundamental em 20% dos nomes monitorados. A orientação institucional é reduzir o risco de liquidez sem abandonar a tese de small caps, padronizando alocação, monitoramento e entradas de novos recursos.",

                    { text: "aumentar a diversificação entre setores e emissores, exigir pelo menos 40 nomes, adiar limites baseados em Volume Médio Diário e dias para zeragem, manter revisões mensais e aceitar prazos maiores de execução até a melhora gradual da liquidez.", isCorrect: false },
                    { text: "elevar a alocação nos papéis com spreads mais largos para capturar possível prêmio de iliquidez, flexibilizar limites de participação em volume diário, manter a tese como diretriz principal e aceitar maior risco de execução no curto prazo.", isCorrect: false }

            {
                id: 13,
                contexto: "Murilo, profissional C-Pro I, está analisando fundos para perfis mais propensos a risco. Ele observa um comportamento atípico no mercado em pregões intraday. As ações de várias companhias que compõem o índice, não raro, apresentam fortes oscilações de preço em poucos minutos, acompanhadas de picos súbitos de volume. Paralelamente, as demonstrações financeiras dessas empresas frequentemente mostram resultados abaixo do esperado, o que pode impactar seu valor de longo prazo. Visando se certificar de que um fundo escolhido é adequado para indicar para a área de distribuição, Murilo analisa se esse fundo fará operações de curtíssimo prazo, explorando a volatilidade, ou se reavaliará o valor justo das ações para a estratégia do fundo.",

                contexto: "Gideão Diniz, profissional C-Pro I certificado pela Anbima que atua na área de investimentos, identificou que uma oferta pública de valores mobiliários distribuída pela Instituição Participante (IP) à qual está vinculado teve atraso de 40 dias no envio de informações obrigatórias à Anbima. Ele tinha uma reunião para orientar os gerentes de relacionamento da instituição a distribuir a oferta, porém decidiu adiar essa reunião e entrou em contato com a área de compliance do banco, pois primeiro precisava entender as consequências desse descumprimento e atraso.",

                ]

            {
                id: 16.1,
                contexto: "Glória é uma profissional C-Pro I da área de Wealth Management de um grande banco de investimentos, que conta com experientes profissionais especialistas em ativos digitais, análise on-chain e estruturação de veículos de investimento. Foi solicitado que Glória montasse um relatório detalhado, apresentando a análise de alguns investimentos que pudessem ser utilizados na recomendação de montagem de carteiras de investidores qualificados. Esse relatório será disponibilizado como subsídio aos profissionais C-PRO R desse banco.\nNa solicitação à Glória, foram destacados dois pontos para a elaboração do relatório:\n(i) evitar volatilidade excessiva em parte da alocação, utilizando instrumentos que ofereçam proteção contra quedas abruptas;\n(ii) explorar oportunidades em protocolos de finanças descentralizadas (DeFi) que gerem renda passiva via staking ou empréstimos de criptoativos, desde que haja segurança operacional e mitigação de riscos de contraparte.\nA análise macroeconômica realizada pela equipe do banco apontou:\n- Taxas de juros globais em patamar elevado, pressionando ativos de risco no curto prazo;\n- Forte expectativa de redução de juros nos EUA no médio prazo;\n- Adoção crescente de soluções de blockchain por grandes empresas e por governos;\n- Regulamentações mais claras em alguns mercados, porém ainda incertas em outros;\n- Volatilidade implícita das principais criptomoedas em níveis acima da média histórica.\nDentre os investimentos analisados, o relatório feito por Glória recomenda a organização de carteiras compostas pelos seguintes investimentos: Fundos de índice (ETFs) de Bitcoin e Ethereum negociados em bolsa brasileira, certificados de operações estruturadas (COEs) com barreira de proteção, stablecoins remuneradas via plataformas reguladas no exterior, fundos de venture capital focados em blockchain, além da compra direta e autocustódia (cold storage) dos criptoativos.",
                enunciado: "Com base no cenário apresentado, a estratégia de alocação em criptoativos que está mais alinhada com o objetivo de equilibrar potencial de retorno e proteção de capital é:",
                options: [
                    { text: "alocar a maior parte em stablecoins remuneradas via plataformas reguladas, complementando com ETFs de Bitcoin e Ethereum, e utilizar COEs com barreira de proteção.", isCorrect: true, gabarito: "O profissional demonstrou capacidade de analisar o contexto apresentado e de escolher, no que se refere a estratégias de investimentos em criptoativos, a estratégia de alocação mais alinhada com os objetivos do cliente. Tendo em vista que o caso menciona que se deve evitar volatilidade excessiva em parte da alocação, utilizando instrumentos que ofereçam proteção contra quedas abruptas, os COEs podem ser estruturados de forma a proteger o capital do investidor. Além disso, o investimento em stablecoins reduz significativamente a volatilidade da carteira, tendo em vista que elas não possuem volatilidade. Finalmente, a alocação em BTC e ETH via ETFs dá ao investidor a possibilidade de se expor a esses tipos de ativos de forma simples e fácil, através do mercado organizado em bolsa de valores." },
                    { text: "alocar a maior parte do montante previsto em protocolos DeFi, com o resto alocado diretamente em Bitcoin e Ethereum autocustodiados.", isCorrect: false },
                    { text: "Destinar 100% do montante previsto para cripto em compra direta de criptomoedas de baixa capitalização, visando a ganhos maiores.", isCorrect: false },
                    { text: "utilizar exclusivamente fundos de venture capital focados em blockchain, com prazo de resgate superior a 10 anos, sem nenhuma exposição direta ou líquida a criptoativos.", isCorrect: false }
                ]
            },

            {
                id: 18.1,
                contexto: "Ricardo é um profissional certificado Anbima que atua na área de análise de fundos listados em uma casa de análises independente. A diretoria dessa casa solicitou a ele que elaborasse um relatório sobre um Fundo de Investimento Imobiliário (FII) do segmento de lajes corporativas que apresentou aumento relevante no índice de vacância nos últimos 12 meses, saindo de 2% para 8% do portfólio. Esse fundo possui uma boa reserva de rendimentos retidos, além de 60% de contratos atípicos de longo prazo e 40% de contratos típicos de curta duração, cujos aluguéis vêm sendo renegociados com descontos de 5% a 10% devido ao desaquecimento do mercado de escritórios.\nPara fazer o relatório solicitado, Ricardo deve avaliar como a vacância crescente e a qualidade dos contratos vigentes podem impactar o fluxo de caixa do fundo, o pagamento de dividendos e a atratividade para investidores de perfil conservador.\nEle deve projetar cenários considerando:\nI Manutenção da vacância atual e suas consequências para o rendimento mensal;\nII Possibilidade de saída antecipada de inquilinos em contratos típicos;\nIII Resiliência dos contratos atípicos frente a possíveis crises de mercado.\nDurante as reuniões de Ricardo com a equipe de gestão, foi destacada a necessidade de elaboração de orientações para a equipe de relacionamento, explicando aos clientes como os diferentes tipos de contrato influenciam a estabilidade dos rendimentos e os riscos associados à vacância prolongada. Diante desse cenário, o relatório preparado por Ricardo deve apresentar estimativas realistas de fluxo de caixa sob diferentes taxas de vacância, discutir a solidez dos contratos de locação e propor estratégias de comunicação que permitam à equipe comercial orientar os investidores de forma clara, equilibrando expectativas de rendimento com riscos de perda de receita e valorização patrimonial.",

                    { text: "concentrar a análise nos contratos atípicos do fundo, desconsiderando os contratos típicos nessa avaliação.", isCorrect: false },

            {
                id: 19,
                contexto: "A equipe de profissionais certificados Anbima do banco de investimentos UBA está desenvolvendo diretrizes para a carteira recomendada de um novo fundo de ações globais. O objetivo é otimizar a diversificação internacional e a liquidez, incorporando ativos de mercados desenvolvidos e emergentes. Para isso, a equipe avalia a inclusão de BDRs de empresas americanas de tecnologia e ADRs de companhias brasileiras com forte presença global. Seu papel é analisar profundamente as estruturas e os níveis desses recibos depositários, considerando as exigências regulatórias da CVM e da SEC, os padrões de disclosure e as modalidades de negociação. Essa análise é crucial para definir a elegibilidade dos ativos e mitigar riscos de mercado, garantindo que a carteira esteja alinhada com o perfil do fundo e com as expectativas de retorno.",

            {
                id: 20,
                contexto: "Durante a revisão periódica da arquitetura de produtos previdenciários de uma corretora, a área técnica analisou os fundos disponíveis na oferta institucional. Verificou-se que fundos vinculados a planos distintos, com regulamentos próprios e gestores diferentes, mantinham exposição relevante a títulos privados emitidos por empresas de um mesmo conglomerado econômico. Tais posições resultaram de decisões independentes e estavam em conformidade com os limites de concentração por emissor e rating previstos nas normas. As análises individuais não indicaram desenquadramentos formais. Contudo, a discussão passou a considerar se a coerência da oferta deveria se restringir ao cumprimento individual dos limites ou incorporar a visão sobre a distribuição dos riscos subjacentes. O profissional C-Pro I participa da análise sob a ótica da coerência técnica e informacional da oferta.",
                enunciado: "Considerando-se o contexto apresentado e o papel do C-Pro I na avaliação da coerência da oferta previdenciária, a interpretação tecnicamente mais consistente é que a:",
                options: [
                    { text: "análise da coerência da oferta pode requerer leitura agregada das exposições econômicas, ainda que os fundos sejam independentes.", isCorrect: true, gabarito: "O profissional demonstrou capacidade de analisar, no contexto de Rentabilidade dos Planos de Previdência, que a coerência da oferta não se limita ao enquadramento isolado de cada veículo, podendo exigir uma leitura agregada das exposições econômicas distribuídas. Essa avaliação é compatível com o papel do C-PRO I, que, embora não decida alocações, verifica se a estrutura da prateleira preserva princípios prudenciais e informacionais necessários para a governança institucional dos produtos ofertados." },

            {

            {

            {
                id: 26,
                contexto: "Durante a revisão de um manual interno de produtos de previdência complementar, foram identificadas orientações divergentes entre as áreas do banco quanto à classificação das modalidades de conversão de saldo em renda e à continuidade dos pagamentos após o falecimento do participante. Enquanto alguns documentos tratam a renda vitalícia com prazo mínimo garantido e os resgates programados como formas equivalentes de proteção aos beneficiários, outros materiais restringem essa característica apenas à renda vitalícia reversível. A inconsistência gera risco operacional e regulatório, pois pode levar os gerentes de agência a fornecer informações imprecisas sobre os produtos. A área técnica, composta por profissionais certificados C- PRO I, foi acionada para emitir um posicionamento único, eliminando a ambiguidade.",

            {
                id: 27,
                contexto: "Na área de estruturação de produtos previdenciários, a equipe técnica revisa o desempenho de duas séries de planos VGBL com políticas de investimento equivalentes, mas com diferentes estruturas de custos.\nO primeiro cobra taxa de carregamento de 2% sobre cada aporte e taxa de administração de 0,8% ao ano; o segundo elimina o carregamento, mas aplica taxa de administração de 2,0% ao ano.\nAs simulações consideram aportes anuais de R$ 120 mil durante 20 anos, com rentabilidade bruta estimada em 8% a.a. antes das taxas.",

            {
                id: 30,
                contexto: "Paulina, profissional C-Pro I, é responsável por elaborar um estudo de alocação de portfólio para subsidiar as recomendações de um banco de investimentos. O estudo busca otimizar a relação risco-retorno de uma carteira-modelo voltada a investidores com perfil de risco moderado.\nConsiderando-se a taxa livre de risco (Selic) de 10,5% a.a., foi identificada uma carteira de ativos de risco com retorno esperado de 16% a.a. e volatilidade de 18% a.a. O objetivo é determinar a composição ótima entre o ativo livre de risco e a carteira de risco, de modo que a volatilidade total da carteira-modelo não ultrapasse 12% a.a.",
                enunciado: "Com base nas informações apresentadas, a alocação percentual ótima entre o ativo livre de risco e a carteira de ativos de risco que mantém a volatilidade total em até 12% a.a. é:",
                options: [

            {

            {
                id: 32.1,
                contexto: "Um profissional C-Pro I integra a equipe responsável por desenvolver e revisar modelos internos de alocação de ativos utilizados pela instituição à qual ele está vinculado para padronizar análises e orientar a construção de portfólios por objetivo financeiro. Como parte desse processo, ele analisou o caso de referência de Carlos, 38 anos, perfil moderado, cuja situação financeira foi previamente mapeada pela área de dados da instituição para fins de estudo e parametrização dos modelos internos.\nO dossiê técnico descreve que Carlos possui renda familiar líquida de R$ 25.000, patrimônio financeiro de aproximadamente R$ 600.000 distribuído entre fundos multimercado e renda fixa tradicional, além de um plano de previdência voltado ao acúmulo para aposentadoria. A base cadastral também indica que ele vive em imóvel próprio quitado e tem dois filhos, de 6 e 9 anos. Para fins de modelagem, o C-Pro I utiliza três objetivos previamente categorizados:\nI - Educação dos filhos: Necessidade projetada para um intervalo de 8 a 12 anos, incluindo possibilidade de universidade privada e eventual intercâmbio.\nII - Aposentadoria: Compromisso de longo prazo com horizonte aos 65 anos, considerando renda futura que combina INSS, previdência e patrimônio acumulado.\nIII - Reserva de oportunidades: Parcela destinada a operações táticas pontuais, sem comprometer a estrutura estratégica de longo prazo.\nAo revisar o material, o C-Pro I avaliou se as premissas de horizonte, risco e estrutura de portfólio estão tecnicamente consistentes com as diretrizes internas de alocação estratégica e tática. No caso da educação, ele válida a lógica de uma estrutura de médio prazo que combina ativos indexados à inflação com participação parcial de renda variável, incorporando trajetória de redução progressiva de risco conforme o horizonte se aproxima, evitando dependência excessiva da renda variável na fase final.\nPara a aposentadoria, C-Pro I avalia se o modelo segue o princípio de glide path, que prevê maior exposição a risco durante a fase de acumulação e redução gradual dessa exposição ao longo do tempo, ajustando a composição da carteira conforme o investidor se aproxima do período de usufruto.\nPor fim, para a reserva de oportunidades, o profissional revisa se o documento diferencia adequamente alocação estratégica (base estrutural dos portfólios) de alocação tática (ajustes conjunturais), reforçando que a reserva não deve gerar revisões estruturais, mas apenas intervenções pontuais justificadas por condições específicas de mercado.\nO objetivo geral do C-Pro I é garantir que o caso técnico represente, de forma fiel e metodologicamente robusta, a aplicação dos princípios de horizonte de investimento, perfil de risco e diferenciação entre estratégias estratégicas e táticas, de modo que os materiais de referência reflitam padrões consistentes para análise interna e construção de portfólios por objetivo.",

                    { text: "combinação de ativos indexados à inflação com parcela moderada em renda variável, reduzida gradualmente conforme o prazo se aproxima.", isCorrect: true, gabarito: "O profissional demonstrou capacidade de analisar, no contexto de Alocação de ativos: horizonte de tempo e perfil do investidor, alocação estratégica em função da evolução do tempo do investimento e alocação tática em função de alterações nas condições do mercado, a coerência entre horizonte médio, proteção do poder de compra e redução progressiva de risco, sem dependência excessiva de ativos voláteis na fase final de utilização do capital." },
                    { text: "predominância de renda variável durante todo o período, priorizando retorno máximo no horizonte projetado para atingir a meta escolar.", isCorrect: false },
                    { text: "alocação concentrada em ativos pós-fixados de curto prazo, priorizando liquidez sobre retorno real exigido pelo longo prazo de educação.", isCorrect: false },
                    { text: "utilização central de produtos previdenciários, uma vez que o objetivo possui relevância financeira intermediária no planejamento do investidor.", isCorrect: false }
                ]
            },
            {
                id: 32.2,
                contexto: "Mesmo contexto da Questão 32.1",
                enunciado: "À luz do papel do C-Pro I na validação metodológica dos modelos internos, a diretriz mais consistente para objetivos de longo e médio prazo é:",
                options: [
                    { text: "ajustar estruturalmente a alocação ao longo do tempo, reduzindo risco conforme o horizonte encurta, independentemente de condições conjunturais.", isCorrect: true, gabarito: "O profissional demonstrou capacidade de analisar, no contexto de Alocação de ativos: horizonte de tempo e perfil do investidor, alocação estratégica em função da evolução do tempo do investimento e alocação tática em função de alterações nas condições do mercado, que o ajuste sistemático de risco ao longo do tempo (glide path) é elemento metodológico central da governança de produtos e independe de movimentos conjunturais de mercado para garantir o atingimento da meta." },
                    { text: "manter a alocação estrutural constante e realizar os ajustes por meio de decisões táticas conforme as oscilações do cenário econômico.", isCorrect: false },
                    { text: "priorizar os ajustes táticos recorrentes para capturar as oportunidades de mercado, mesmo em objetivos que foram definidos por um horizonte fixo.", isCorrect: false },
                    { text: "definir a alocação inicial com base exclusivamente no perfil do investidor e mantê-la estável até o término do objetivo financeiro.", isCorrect: false }
                ]
            },
            {
                id: 33,
                contexto: "Marcelo, profissional C-Pro I, é responsável pela validação de modelos de risco para carteiras recomendadas de um fundo de ações e está revisando o desempenho do modelo de Value at Risk (VaR) diário (99% de confiança) utilizado. Nos últimos 250 dias úteis, o modelo registrou 8 exceções, ou seja, 8 dias em que a perda real da carteira superou o VaR previsto. Tal número de violações levanta questões sobre a aderência do modelo à realidade do mercado. Marcelo precisa avaliar se a frequência de exceções está alinhada às expectativas regulatórias e às boas práticas de gestão de risco, considerando-se a importância do backtesting para a confiabilidade das projeções de risco e a elaboração de diretrizes de investimento. A análise é crucial para determinar a necessidade de recalibração do modelo ou ajustes na política de risco.",
                enunciado: "A ação recomendada para Marcelo e a avaliação regulatória que a motiva, conforme as diretrizes de gestão de risco, devem ser:",
                options: [
                    { text: "exigir investigação detalhada e possível recalibração do modelo de VaR, na medida em que o nível de confiança de 99% foi extrapolado.", isCorrect: true, gabarito: "O profissional demonstrou capacidade de, no contexto de gestão de riscos em fundos de investimento e carteiras administradas, determinar que 8 exceções em 250 observações extrapolam o limite de 3 eventos (aproximação de 1% de 250 observações) do nível de confiança de 99%, demandando investigação adicional e eventual recalibração para assegurar aderência ao risco real de mercado." },
                    { text: "exigir recalibração imediata e severa, já que qualquer número de exceções representa falha grave do modelo e invalida sua utilização.", isCorrect: false },
                    { text: "não exigir ajustes, pois 8 exceções em 250 dias são consideradas dentro da variação normal esperada para um modelo de 99% de confiança.", isCorrect: false },
                    { text: "desconsiderar o backtesting, pois o VaR de 99% garante que a perda real nunca superará o valor projetado, sendo desnecessário verificar exceções.", isCorrect: false }
                ]
            },
            {
                id: 34,
                contexto: "Sílvia, gerente de relacionamento, possui um cliente institucional com patrimônio de R$ 10 milhões, com carteira originalmente alocada 60% em ações e 40% em renda fixa. Ela pede ajuda a Leonardo, profissional C-Pro I, para revisar a carteira de seu cliente. Após seis meses de mercado em alta, as ações se valorizaram alterando a composição da carteira para 68% em ações e 32% em renda fixa. O cliente possui uma carteira com horizonte de 10 anos, priorizando controle de risco com participação em ganhos.",
                enunciado: "No cenário apresentado, a estratégia de gestão que Leonardo deve sugerir a Sílvia para que adote com seu cliente é:",
                options: [
                    { text: "rebalancear para 60/40 (constant mix), mantendo controle de risco conforme perfil moderado.", isCorrect: true, gabarito: "O profissional demonstrou capacidade de, no contexto de rebalanceamento de carteira de ativos, sugerir à gerente que avalie a necessidade de alinhar a carteira ao perfil do cliente, reconhecendo que o rebalanceamento para 60/40 via constant mix restabelece a proporção de risco adequada, preservando a disciplina de investimento e o controle de volatilidade. A estratégia constant mix é adequada para perfil do cliente pois mantém exposição ao risco constante através do rebalanceamento periódico. O desbalanceamento para 68/32 aumentou o risco além do planejado, exigindo realocação para 60/40 original para manter coerência com o perfil e os objetivos do cliente." },
                    { text: "manter a posição atual (buy and hold), aproveitando momento favorável do mercado acionário.", isCorrect: false },
                    { text: "implementar proteção dinâmica com piso de 90%, garantindo capital, mas limitando ganhos futuros.", isCorrect: false },
                    { text: "aumentar a exposição em ações para 80%, aproveitando tendência de alta e maximizando retornos.", isCorrect: false }
                ]
            },
            {
                id: 35,
                contexto: "Gabriela, profissional C-Pro I em um banco brasileiro, recebeu a tarefa de avaliar a exposição da carteira corporativa da instituição no setor de energia. Seu chefe solicitou que ela estimasse a perda esperada da carteira. Os dados agregados disponíveis são: exposição total de R$ 200 milhões, probabilidade de inadimplência média de 2% ao ano e perda, em caso de inadimplência, de 50%. Além disso, Gabriela sabe que parte da carteira está concentrada em um único tomador com rating especulativo, aumentando a necessidade de mensuração adequada do risco e eventual hedge se a perda esperada for considerada grande demais.",
                enunciado: "A partir dos dados recebidos, Gabriela mensura o risco de crédito através da perda esperada anual da carteira, que é de:",
                options: [
                    { text: "R$ 2 milhões, levando em conta a probabilidade de inadimplência e a perda, caso ocorra.", isCorrect: true, gabarito: "O profissional demonstrou capacidade de calcular, no contexto de mensuração do risco de crédito, a perda esperada da carteira, considerando as informações dadas. Memória de cálculo: 200.000.000,00 x 0,02 x 0,5 = 2.000.000,00" },
                    { text: "R$ 4 milhões, levando em conta a probabilidade de inadimplência e a perda do evento.", isCorrect: false },
                    { text: "R$ 100 milhões, levando em conta a perda, caso a inadimplência da carteira ocorra.", isCorrect: false },
                    { text: "R$ 200 milhões, levando em conta a perda, caso toda a carteira fique inadimplente.", isCorrect: false }
                ]
            },
            {
                id: 36,
                contexto: "Luísa é profissional certificada Anbima de um banco e precisa escolher debêntures para compor uma carteira de investimentos. Ela precisou revisar o spread de crédito exigido para um novo título emitido por uma empresa do setor de óleo e gás. Atualmente, a debênture de 5 anos é precificada a 110 pontos base acima do título público soberano de mesma maturidade. O modelo interno do banco estima uma probabilidade de inadimplência acumulada de 3% para esse horizonte temporal, com taxa de recuperação esperada de 40%. O chefe de Luísa a questiona se o spread atual é suficiente para compensar o risco assumido, considerando que os investidores demandam um prêmio adicional de risco de liquidez de 20 pontos base.",
                enunciado: "Com base nessas informações, Luísa responde a seu chefe que o spread de 110 pontos base é:",
                options: [
                    { text: "suficiente, pois o prêmio de crédito projetado, somado ao prêmio de liquidez, resulta em valor inferior ao spread atual.", isCorrect: true, gabarito: "O profissional demonstrou capacidade de analisar, no contexto de administração e gerenciamento de risco, que o spread oferecido pela debênture era superior àquele calculado a partir do risco de inadimplência estimado pelo banco e, por isso, é adequado. Cálculo: 3% (1 – 0,4) = 1,8% no período, fazendo a equivalência da taxa por ano [1,018^(1/5)]-1 = 0,357%, adicionamos o risco de liquidez, totalizando 0,557% ou aproximadamente 56 pontos base." },
                    { text: "excessivo, já que a probabilidade de inadimplência acumulada de 3%, implica prêmio de risco de aproximadamente 60 pontos base.", isCorrect: false },
                    { text: "adequado, se for considerada a hipótese de taxa de recuperação nula, pois, nesse caso, o prêmio de risco seria próximo a esse valor.", isCorrect: false },
                    { text: "insuficiente, pois o prêmio de risco, adicionado ao risco de liquidez, exigiria um spread de 200 pontos base.", isCorrect: false }
                ]
            }
        ];

        // Função de embaralhamento Fisher-Yates
        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        const App = () => {
            const [view, setView] = React.useState('home'); // home, study, quiz
            const [quizQuestions, setQuizQuestions] = React.useState([]);

            // Inicializa e embaralha as alternativas apenas na montagem
            React.useEffect(() => {
                const preparedQuestions = rawQuizData.map(q => {
                    // Guarda o gabarito que estava na primeira opção (correta)
                    const correctOption = q.options.find(o => o.isCorrect);
                    const gabaritoText = correctOption ? correctOption.gabarito : "";
                    
                    return {
                        ...q,
                        options: shuffleArray(q.options),
                        gabaritoText: gabaritoText
                    };
                });
                setQuizQuestions(preparedQuestions);
            }, []);

            return (
                <div className="min-h-screen">
                    <header className="bg-orange-600 text-white shadow-md sticky top-0 z-50">
                        <div className="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
                            <h1 className="text-xl font-bold font-mono tracking-tight flex items-center gap-2">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                C-Pro I Trainer
                            </h1>
                            <nav className="flex gap-4">
                                <button onClick={() => setView('home')} className={`font-semibold hover:text-orange-200 transition ${view==='home'?'border-b-2 border-white':''}`}>Início</button>
                                <button onClick={() => setView('study')} className={`font-semibold hover:text-orange-200 transition ${view==='study'?'border-b-2 border-white':''}`}>Estudo</button>
                                <button onClick={() => setView('quiz')} className={`font-semibold hover:text-orange-200 transition ${view==='quiz'?'border-b-2 border-white':''}`}>Simulado</button>
                            </nav>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto p-4 py-8">
                        {view === 'home' && <HomeView setView={setView} />}
                        {view === 'study' && <StudyView />}
                        {view === 'quiz' && <QuizView questions={quizQuestions} setView={setView} />}
                    </main>
                </div>
            );
        };

        const HomeView = ({ setView }) => (
            <div className="fade-in text-center flex flex-col items-center justify-center py-12">
                <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 max-w-2xl w-full">
                    <h2 className="text-3xl font-extrabold text-slate-800 mb-4">Certificação ANBIMA C-Pro I</h2>
                    <p className="text-slate-600 mb-8 text-lg">
                        Bem-vindo(a) ao ambiente de preparação. Aqui você encontra os resumos completos do edital e o simulado oficial interativo com todas as 36 questões.
                    </p>
                    <div className="grid md:grid-cols-2 gap-6">
                        <button onClick={() => setView('study')} className="group flex flex-col items-center justify-center p-6 bg-slate-50 rounded-xl border border-slate-200 hover:border-orange-500 hover:bg-orange-50 transition duration-300">
                            <span className="text-4xl mb-3 group-hover:scale-110 transition">📚</span>
                            <span className="font-bold text-slate-800 text-xl mb-2">Material de Estudo</span>
                            <span className="text-sm text-slate-500">Resumo dos 4 Macrotemas Exigidos</span>
                        </button>
                        <button onClick={() => setView('quiz')} className="group flex flex-col items-center justify-center p-6 bg-slate-50 rounded-xl border border-slate-200 hover:border-orange-500 hover:bg-orange-50 transition duration-300">
                            <span className="text-4xl mb-3 group-hover:scale-110 transition">📝</span>
                            <span className="font-bold text-slate-800 text-xl mb-2">Simulado Interativo</span>
                            <span className="text-sm text-slate-500">Todas as questões embaralhadas</span>
                        </button>
                    </div>
                </div>
            </div>
        );

        const StudyView = () => {
            return (
                <div className="fade-in">
                    <h2 className="text-3xl font-bold text-slate-800 mb-6">Material de Apoio C-Pro I</h2>
                    <div className="space-y-6">
                        {studyData.map((item, index) => (
                            <div key={item.id} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="bg-slate-50 px-6 py-4 border-b border-slate-200">
                                    <h3 className="text-xl font-bold text-slate-800">{item.title}</h3>
                                </div>
                                <div className="p-6 text-slate-700 leading-relaxed whitespace-pre-wrap">
                                    {item.content}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const QuizView = ({ questions, setView }) => {
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [selectedOption, setSelectedOption] = React.useState(null);
            const [hasAnswered, setHasAnswered] = React.useState(false);
            const [score, setScore] = React.useState(0);
            const [quizFinished, setQuizFinished] = React.useState(false);

            if (questions.length === 0) return <div>Carregando...</div>;

            const q = questions[currentIndex];

            const handleOptionClick = (option) => {
                if (hasAnswered) return;
                setSelectedOption(option);
                setHasAnswered(true);
                if (option.isCorrect) {
                    setScore(prev => prev + 1);
                }
            };

            const handleNext = () => {
                if (currentIndex < questions.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                    setSelectedOption(null);
                    setHasAnswered(false);
                } else {
                    setQuizFinished(true);
                }
            };

            if (quizFinished) {
                return (
                    <div className="fade-in bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center max-w-2xl mx-auto">
                        <h2 className="text-3xl font-bold text-slate-800 mb-4">Simulado Concluído!</h2>
                        <div className="text-6xl mb-6">{score >= (questions.length * 0.7) ? '🎉' : '📈'}</div>
                        <p className="text-xl text-slate-700 mb-2">Seu resultado:</p>
                        <p className="text-4xl font-extrabold text-orange-600 mb-6">{score} de {questions.length}</p>
                        <p className="text-slate-500 mb-8">
                            A nota mínima exigida pela ANBIMA é de 70%.
                            Você atingiu {Math.round((score / questions.length) * 100)}%.
                        </p>
                        <div className="flex justify-center gap-4">
                            <button 
                                onClick={() => {
                                    setCurrentIndex(0);
                                    setScore(0);
                                    setQuizFinished(false);
                                    setHasAnswered(false);
                                    setSelectedOption(null);
                                    // As opções mantêm-se embaralhadas, mas você pode re-embaralhar aqui se quiser
                                }} 
                                className="bg-orange-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-orange-700 transition">
                                Refazer Simulado
                            </button>
                            <button 
                                onClick={() => setView('study')} 
                                className="bg-slate-200 text-slate-800 font-semibold py-3 px-6 rounded-lg hover:bg-slate-300 transition">
                                Revisar Material
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="fade-in max-w-3xl mx-auto">
                    {/* Barra de Progresso */}
                    <div className="mb-6 flex justify-between items-center text-sm font-semibold text-slate-500">
                        <span>Questão {currentIndex + 1} de {questions.length}</span>
                        <span>Acertos: {score}</span>
                    </div>
                    <div className="w-full bg-slate-200 rounded-full h-2.5 mb-8">
                        <div className="bg-orange-600 h-2.5 rounded-full transition-all duration-300" style={{ width: `${((currentIndex) / questions.length) * 100}%` }}></div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        {/* Contexto e Enunciado */}
                        <div className="p-6 md:p-8 bg-slate-50 border-b border-slate-200">
                            {q.contexto && (
                                <div className="mb-6">
                                    <span className="inline-block px-3 py-1 bg-slate-200 text-slate-700 text-xs font-bold rounded-full mb-3 uppercase tracking-wider">Contexto</span>
                                    <p className="text-slate-700 text-justify whitespace-pre-wrap text-sm leading-relaxed">{q.contexto}</p>
                                </div>
                            )}
                            <h3 className="text-lg md:text-xl font-semibold text-slate-800 leading-snug">{q.enunciado}</h3>
                        </div>

                        {/* Alternativas */}
                        <div className="p-6 md:p-8 space-y-3">
                            {q.options.map((opt, i) => {
                                let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all duration-200 ";
                                if (!hasAnswered) {
                                    btnClass += "border-slate-200 hover:border-orange-400 hover:bg-orange-50 bg-white text-slate-700 cursor-pointer";
                                } else {
                                    if (opt.isCorrect) {
                                        btnClass += "border-green-500 bg-green-50 text-green-800 font-medium";
                                    } else if (selectedOption === opt && !opt.isCorrect) {
                                        btnClass += "border-red-500 bg-red-50 text-red-800";
                                    } else {
                                        btnClass += "border-slate-200 bg-slate-50 text-slate-400 opacity-60 cursor-not-allowed";
                                    }
                                }

                                return (
                                    <button 
                                        key={i} 
                                        disabled={hasAnswered}
                                        onClick={() => handleOptionClick(opt)}
                                        className={btnClass}
                                    >
                                        <div className="flex items-start gap-3">
                                            <span className="font-bold shrink-0 mt-0.5">{String.fromCharCode(65 + i)}.</span>
                                            <span>{opt.text}</span>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>

                        {/* Feedback Area */}
                        {hasAnswered && (
                            <div className={`p-6 border-t ${selectedOption?.isCorrect ? 'bg-green-100 border-green-200' : 'bg-red-100 border-red-200'} fade-in`}>
                                <div className="flex items-center gap-3 mb-3">
                                    <span className="text-2xl">{selectedOption?.isCorrect ? '✅' : '❌'}</span>
                                    <h4 className={`text-xl font-bold ${selectedOption?.isCorrect ? 'text-green-800' : 'text-red-800'}`}>
                                        {selectedOption?.isCorrect ? 'Correto!' : 'Incorreto!'}
                                    </h4>
                                </div>
                                <div className={`text-sm md:text-base leading-relaxed ${selectedOption?.isCorrect ? 'text-green-900' : 'text-red-900'}`}>
                                    <span className="font-bold block mb-1">Explicação (Gabarito Oficial):</span>
                                    {q.gabaritoText}
                                </div>
                                
                                <div className="mt-6 flex justify-end">
                                    <button 
                                        onClick={handleNext}
                                        className="bg-slate-800 text-white font-semibold py-3 px-8 rounded-xl hover:bg-slate-700 transition shadow-sm"
                                    >
                                        {currentIndex < questions.length - 1 ? 'Próxima Questão ➔' : 'Ver Resultado'}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                    
                    <div className="mt-8 text-center">
                         <button onClick={() => setView('study')} className="text-orange-600 font-semibold hover:underline">
                            ← Voltar para Material de Estudo
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
