O núcleo do exame C-Pro I. Exige domínio técnico profundo sobre infraestrutura, precificação de produtos tradicionais, dinâmica de mercado e carga tributária de fundos, renda fixa, renda variável e derivativos.

### 1. Resolução CVM 175 (Novo Marco Regulatório dos Fundos)
Esta resolução unificou e modernizou as regras para Fundos de Investimento no Brasil, substituindo a antiga CVM 555.
*   **Segregação de Patrimônio e Classes:** Permite a divisão de um fundo em "classes" e "subclasses" de cotas, com patrimônios segregados. Isso significa que se uma classe quebrar (insolvência), o patrimônio das outras classes do mesmo fundo não será afetado.
*   **Responsabilidade Limitada do Cotista:** Os cotistas agora podem ter responsabilidade limitada ao valor de suas cotas (como numa empresa LTDA). Antes, podiam ser chamados a cobrir rombos (aportar mais dinheiro) no fundo.
*   **Democratização:** Flexibilizou o acesso do público de varejo a FIDCs (Fundos de Investimento em Direitos Creditórios) e FIPs (Fundos de Investimento em Participações), antes restritos a investidores qualificados ou profissionais.
*   **Taxas e Provisionamento:** Mudanças na forma como a taxa de administração e performance são calculadas e informadas (provisionamento diário, deduzido da cota, garantindo que a rentabilidade mostrada já é líquida de taxas).

### 2. Renda Fixa e Títulos Públicos/Privados
*   **Resolução CMN 5.118:** Restringiu rigorosamente os lastros elegíveis para emissão de CRAs, CRIs, LCAs e LCIs. O objetivo foi direcionar o crédito isento para o produtor rural/imobiliário real, proibindo operações estruturadas entre empresas do mesmo grupo econômico criadas apenas para obter benefício fiscal (isenção de IR).
*   **Precificação, Volatilidade e Riscos:**
    *   **Duration (Macaulay e Modificada):** Mede o tempo médio de recebimento dos fluxos e a sensibilidade do título a variações na taxa de juros. Quanto maior a duration (títulos longos), maior o risco (volatilidade) e o impacto da marcação a mercado.
    *   **Convexidade:** Ajuste fino da duration, pois a relação preço vs. taxa não é linear, mas convexa. Ajuda a medir o erro da duration para grandes choques de juros.
    *   **Marcação a Mercado (MtM) vs. Marcação na Curva:** MtM precifica o título pelo valor que ele seria vendido hoje (gera volatilidade diária na cota, mas é transparente). Marcação na curva assume que o título será levado ao vencimento (esconde a volatilidade, mas embute risco de liquidez se precisar vender antes).
    *   **Risco de Crédito:** Mensuração via Ratings (agências de classificação), PD (Probability of Default - probabilidade de calote), LGD (Loss Given Default - perda severa após tentar recuperar garantias) e Spreads de crédito (prêmio exigido acima do título sem risco).
*   **Índices:** IMA-B (cesta de títulos indexados ao IPCA/NTN-Bs), IRF-M (títulos prefixados/LTNs), IDkA (índice de duration constante).

### 3. Renda Variável
*   **Avaliação Fundamentalista:** Foca na saúde financeira da empresa. Uso de múltiplos como P/L (Preço/Lucro) e EV/EBITDA para encontrar o valor justo (intrínseco) da ação a longo prazo.
*   **Eventos Corporativos:** IPO (Oferta Inicial), Follow-on (nova emissão de ações), OPA (Oferta Pública de Aquisição para fechar capital), Inplit (Grupamento - une ações para aumentar o preço unitário), Split (Desdobramento - divide ações para dar liquidez).
*   **Análise Técnica/Gráfica:** Usada estritamente em operações de curtíssimo prazo (day trade, swing trade) para identificar tendências emocionais e padrões de preços e volume (intraday), ignorando totalmente os fundamentos contábeis da empresa.

### 4. Derivativos e Operações Estruturadas (COE)
*   **Finalidades de Uso:** Hedge (proteção contra oscilações indesejadas, ex: travar dólar), Especulação (alavancagem direcional assumindo risco) ou Arbitragem (lucro sem risco buscando distorções de preço no mesmo instante em mercados diferentes).
*   **Instrumentos:**
    *   *Futuros e Termos:* Acordos para compra/venda em data futura. Contratos Futuros têm ajuste diário de perdas e ganhos na B3 (mitiga drasticamente o risco de contraparte).
    *   *Opções (As Gregas):* Call (direito de compra), Put (direito de venda). Delta (sensibilidade direcional ao preço do ativo-objeto), Gamma (aceleração/sensibilidade do Delta), Theta (sensibilidade ao tempo/vencimento), Vega (sensibilidade à volatilidade implícita).
    *   *Swaps:* Troca de indexadores (ex: trocar taxa prefixada por variação do dólar).
*   **COE (Certificado de Operações Estruturadas):** Combina renda fixa e derivativos em um pacote. Pode garantir Capital Protegido (o investidor não perde o principal se der errado), mas o investidor assume integralmente o risco de crédito do banco emissor do COE.

### 5. Tributação de Investimentos
*   **Come-Cotas:** Antecipação semestral (último dia útil de Maio e Novembro) do IR em Fundos de Renda Fixa e Multimercados abertos. Reduz violentamente o efeito dos juros compostos no longo prazo.
*   **Renda Variável Pessoas Físicas:** Swing Trade (15% sobre lucro, isenção em vendas até R$20 mil no mês), Day Trade (20% sobre lucro, SEM isenção mensal), FIIs (20% sobre lucro na venda de cotas, dividendos mensais isentos).
*   **Compensação de Prejuízos:** Prejuízos podem ser compensados com lucros futuros da *mesma natureza e mesma alíquota* (FII só abate FII, Swing Trade de Ação só abate Swing Trade de Ação, Day Trade só abate Day Trade). Não há limite de tempo para compensar, desde que declarado.

O foco deste macrotema é a iliquidez, o prêmio de risco, a baixa correlação com mercados tradicionais e a internacionalização e digitalização do portfólio.

### 1. Private Equity, Venture Capital e FIPs
*   **Estágios de Investimento:** Seed Capital (ideia inicial, alto risco), Venture Capital (empresas jovens já operacionais com alto potencial de escala e crescimento), Private Equity/Buyout (compra de controle ou grande participação de empresas maduras para reestruturação e futura venda/IPO).
*   **FIPs (Fundos de Investimentos em Participações):** Não são fundos de gestão passiva. Exigem influência efetiva na gestão da empresa investida (melhorar governança, ter assento no conselho de administração, poder de veto). O objetivo é agregar valor operacional e vender a participação com lucro anos depois (Curva J). A CVM autoriza FIPs a usar derivativos APENAS para hedge (proteção) de suas posições, não para especulação.

### 2. Crédito Estruturado (FIDCs)
*   **FIDCs (Fundos de Investimento em Direitos Creditórios):** Compram recebíveis (contas a receber, cheques, boletos, faturas de cartão) de empresas, antecipando o dinheiro.
*   **Hierarquia de Risco e Subordinação das Cotas:**
    *   *Cotas Seniores:* Menor risco e menor retorno. Recebem primeiro as amortizações.
    *   *Cotas Mezanino:* Risco e retorno intermediários.
    *   *Cotas Subordinadas:* Maior risco. Absorvem os primeiros calotes (inadimplência) da carteira de boletos. Funcionam como o "colchão de proteção" das cotas seniores. Normalmente são detidas pela própria empresa que originou os recebíveis.
*   **FIDC Classe Fechada com Chamada de Capital:** O investidor assina um compromisso financeiro, mas só desembolsa o dinheiro (integraliza) quando o gestor "chama" (quando encontra boletos no mercado para comprar). O retorno do capital ocorre via amortizações ao longo da vida do fundo conforme os boletos são pagos.

### 3. Investimentos no Exterior
*   **Nova Lei das Offshores (Lei 14.754/2023):** Mudou radicalmente a tributação. Acabou o "diferimento fiscal" (postergação do IR) em paraísos fiscais. Agora, os lucros auferidos (rendimentos, dividendos e juros) em trusts, offshores e aplicações financeiras diretas no exterior são tributados anualmente (alíquota fixa de 15% na DAA - Declaração de Ajuste Anual), independentemente de o dinheiro ser trazido de volta para o Brasil. Impostos pagos no exterior podem ser compensados se houver acordo de reciprocidade.
*   **BDRs (Brazilian Depositary Receipts):** Recibos negociados na B3 (Brasil) que representam ações de empresas estrangeiras.
    *   *Nível I:* Não patrocinados (a empresa gringa não pediu para estar aqui). Menor exigência de disclosure (transparência), balanços não precisam ser traduzidos para normas brasileiras.
    *   *Níveis II e III:* Patrocinados (a empresa ativamente quer captar no Brasil). Exigem registro total na CVM, alta transparência. Ideais para fundos com gestão profissional e regras rígidas de compliance.
*   **ADRs (American Depositary Receipts):** O caminho inverso, recibos de empresas brasileiras negociados nas bolsas dos EUA (sujeitos à regulação pesada da SEC americana).

### 4. Ativos Digitais e Criptoeconomia
*   **Cenário Macroeconômico vs. Cripto:** Bitcoin e Ethereum se comportam no mercado institucional como "ativos de risco". Quando o Banco Central dos EUA (Fed) reduz as taxas de juros, o custo de oportunidade cai, aumentando a liquidez global e o apetite por ativos de risco, favorecendo ralis de alta em criptomoedas. Juros altos nos EUA sugam dinheiro de cripto para Renda Fixa americana.
*   **Volatilidade e Proteção (Stablecoins):** Para evitar a alta volatilidade do Bitcoin sem sair do ecossistema cripto, usa-se *Stablecoins* (moedas com paridade 1:1 com o Dólar).

Este módulo exige conhecimentos sobre planejamento sucessório, vantagens tributárias atuariais, fase de acumulação e cálculos da fase de desacumulação.

### 1. Modalidades de Planos: PGBL vs VGBL
*   **PGBL (Plano Gerador de Benefício Livre):** Ideal para quem usa a declaração *Completa* do IR. O aporte anual pode ser deduzido até o limite de 12% da renda bruta tributável do investidor. **O ônus:** No resgate, o imposto de renda incidirá sobre o **Valor Total** (Soma dos Aportes + Rendimentos).
*   **VGBL (Vida Gerador de Benefício Livre):** Ideal para quem usa a declaração *Simplificada*, isentos, ou quem já estourou o limite de 12% do PGBL. Não permite dedução fiscal. **O bônus:** No resgate, o imposto de renda incidirá **Apenas sobre a Rentabilidade** (lucro), poupando o capital principal. Além disso, por ser tecnicamente um seguro de pessoas, não entra em inventário e é transmitido rapidamente aos herdeiros.

### 2. Regimes de Tributação, Come-cotas e IOF
*   **A Grande Vantagem - Ausência de Come-Cotas:** O principal diferencial atuarial da previdência (PGBL/VGBL) contra os fundos de Renda Fixa tradicionais é a ausência total da cobrança semestral do IR. Sem o governo "mordendo" o saldo duas vezes ao ano, os juros compostos trabalham com a base de capital cheia por décadas, gerando um patrimônio final muito superior.
*   **Tabela Regressiva (Definitiva):** O imposto foca no longo prazo. Começa punitivo em 35% (resgates em menos de 2 anos) e cai a cada dois anos até atingir a alíquota mínima de 10% (para dinheiro investido há mais de 10 anos). O critério é o método PEPS (Primeiro a Entrar, Primeiro a Sair).
*   **Tabela Progressiva (Compensável):** Baseada na tabela de salários do IRPF (de 0% a 27,5%). Retém 15% na fonte no ato do resgate e o investidor ajusta a diferença na declaração anual.
*   **IOF no VGBL (Decreto 12.499/2025):** Para coibir o uso de VGBL apenas como manobra tributária de curto prazo para milionários, o governo instituiu IOF de 5% sobre aportes anuais gigantescos (acima de R$ 300 mil em 2025, e R$ 600 mil a partir de 2026).

### 3. Estrutura de Custos
*   **Taxa de Carregamento (Entrada/Saída):** Cobrada percentualmente sobre cada aporte (carregamento de entrada) ou sobre o resgate. Afeta apenas o montante daquela movimentação específica. É menos prejudicial no longuíssimo prazo.
*   **Taxa de Administração:** O vilão silencioso. Cobrada continuamente (provisionada diariamente) sobre o patrimônio TOTAL do fundo (aportes + juros de todos os anos passados). Uma taxa de administração alta destrói a rentabilidade real do plano de forma exponencial com o passar do tempo.

### 4. A Fase de Desacumulação e Regras Atuariais
*   **Tipos de Renda:**
    *   *Renda Mensal Vitalícia Simples:* Paga até a morte do titular. Se ele morrer prematuramente, o saldo restante fica para a seguradora (princípio do mutualismo).
    *   *Renda Vitalícia Reversível ao Beneficiário:* A ÚNICA modalidade que garante, atuarial e contratualmente, que os pagamentos continuarão sendo feitos (integral ou um % definido) ao cônjuge ou filhos após a morte do titular primário, até a morte dos beneficiários.
*   **Risco de Sequência de Retornos:** O maior perigo na aposentadoria. Se o investidor começa a fazer saques mensais para viver logo num período em que a bolsa (ações) cai severamente, ele será obrigado a liquidar um volume enorme de cotas na baixa para levantar o dinheiro da sua "mesada". O patrimônio derreterá rapidamente, gerando risco de ruína. **Mitigação (Glide Path):** Reduzir a alocação em risco/volatilidade e montar estoques de liquidez conservadora conforme a data da aposentadoria se aproxima.

Avalia a capacidade analítica do profissional para montar e rebalancear carteiras (Asset Allocation) baseadas no cenário e perfil do cliente, usando matemática financeira, estatística e teoria moderna.

### 1. Teoria Moderna do Portfólio (Markowitz) e CAPM
*   **Fronteira Eficiente:** Markowitz provou que, combinando ativos descorrelacionados (correlação próxima de 0 ou negativa), é possível criar uma carteira que oferece o máximo retorno matemático para um dado nível de risco. A diversificação elimina o risco *não-sistemático* (da empresa/micro), restando apenas o risco *sistemático* (do mercado/macro).
*   **CAPM (Capital Asset Pricing Model):** Calcula a taxa de retorno que os investidores devem exigir para aceitar investir em um ativo arriscado.
    *   *Fórmula:* Re = Rf + Beta * (Rm - Rf)
    *   Onde Rf é a taxa livre de risco (Selic), Rm é o retorno do mercado (Ibovespa), e **Beta** mede a volatilidade e o risco sistêmico do ativo em relação ao mercado.
*   **Volatilidade da Carteira (Risco):** Não é a simples média das volatilidades individuais. Depende fundamentalmente da proporção de alocação (peso 'w') e da covariância entre os ativos.
    *   *Exemplo Matemático:* Se a carteira Arrojada "X" tem risco de 18% a.a. e a restrição de risco do cliente é 12% a.a. Como a taxa livre de risco (Selic) tem volatilidade ZERO, a conta é simples: (Risco Alvo 12 / Risco da Carteira 18) = 0,6667. Logo, aloca-se 66,67% na Carteira X e o restante 33,33% na Selic.

### 2. Indicadores de Performance Ajustados ao Risco
*   **Índice de Sharpe:** Avalia o retorno gerado acima da Selic por cada unidade de risco assumido. (Prêmio / Volatilidade Total). Penaliza o gestor tanto por quedas bruscas quanto por altas bruscas (pois o desvio padrão trata qualquer fuga da média como risco).
*   **Índice de Treynor:** Similar ao Sharpe, mas no denominador divide o prêmio pelo **Beta** (apenas o risco sistemático). É a métrica ideal para avaliar carteiras já perfeitamente diversificadas.
*   **Índice de Sortino:** Evolução do Sharpe. No denominador, usa apenas o *Downside Risk* (desvio padrão apenas dos retornos negativos). Agrada mais aos investidores, pois não pune o fundo se ele tiver uma "volatilidade positiva" (se explodir de subir).

### 3. Alocação de Ativos, Rebalanceamento e Gestão Tática
*   **Glide Path (LDI - Liability Driven Investment):** Filosofia focada em um objetivo com data marcada (ex: faculdade do filho ou aposentadoria). O risco começa alto na fase de acumulação e é estrutural e mecanicamente reduzido para Renda Fixa e Inflação conforme o prazo encurta. O ajuste é temporal e estrutural, ignorando euforias ou pânicos do cenário macro.
*   **Constant Mix (Rebalanceamento Passivo):** Manter proporções fixas (ex: 60% bolsa, 40% renda fixa). Se a bolsa dispara e o peso vai para 68%, o portfólio ficou mais arriscado do que o perfil do cliente permite. A regra exige vender ações (com lucro, na alta) e comprar renda fixa (na baixa) para voltar ao trilho 60/40.
*   **Tactical Asset Allocation (Gestão Tática):** Desvios temporários da alocação estrutural para capturar oportunidades de cenário. Exemplo: se o Banco Central sinaliza queda aguda da Selic (juros caindo), o gestor tático compra Títulos Prefixados para ganhar dinheiro forte com a marcação a mercado positiva, e reduz a parcela de liquidez em Caixa (CDI), que renderá cada vez menos.

### 4. Avaliação de Riscos Modelados
*   **Value at Risk (VaR):** Métrica estatística de perda financeira. Ex: VaR Diário 99% = R$ 1 Milhão. Significa que, em 99% dos pregões, a perda não passará de R$ 1 milhão. Sobra 1% de chance estatística (a cauda do risco, cerca de 2 a 3 dias no ano útil de 252 dias) de o mercado enlouquecer e a perda ser pior que 1 milhão.
*   **Backtesting de VaR:** A auditoria do modelo. Se um modelo de 99% previu errar 2.5 vezes no ano, mas na prática o fundo teve prejuízos maiores que o limite em 8 dias do ano, o modelo estatístico está "furado" (subestimando perigos reais da economia) e exige recalibração urgente para evitar sanções regulatórias.
*   **Risco de Liquidez (O perigo das Small Caps):** Dificuldade de transformar ativo em dinheiro rápido sem derreter o preço. Avaliado via *Spread* bid-ask (ficou caro comprar/vender) e *Volume Médio Diário* (VMD). Para mitigar: limitar a posição do fundo a uma % pequena do VMD (ex: max 15%) ou estabelecer uma regra de "dias necessários para zerar a posição" (ex: max 5 dias).
*   **Perda Esperada de Risco de Crédito (Expected Loss):** 
    *   *Fórmula:* PE = Exposição (EAD) * Probabilidade de Calote (PD) * Perda Dado o Calote (LGD).
    *   *Exemplo Prático:* Empréstimo de R$ 200 Milhões. Risco de Calote na economia de 2% ao ano. Se o calote ocorrer, a justiça só recupera 50% dos bens, logo a LGD (Perda Definitiva) é os outros 50%. Conta: R$ 200 Mi * 2% = 4 Mi sofrendo calote. Dos 4 Mi, metade se perde de vez = Perda Esperada Real de R$ 2 Milhões ao ano.
`

            {

            {

            {
                id: 15,
                temaId: 'tema2',
                contexto: "Francisco, profissional C-Pro I, é responsável pelos investimentos internacionais na gestora onde trabalha. Para realizar seu trabalho e embasar as recomendações das carteiras que elabora, ele tem de acompanhar a economia dos Estados Unidos e conhecer as metodologias utilizadas no cálculo dos principais índices de ações do mercado americano, já que, dependendo da metodologia, pode haver percepções diferentes desse mercado. Para elaborar uma nova carteira, Francisco quer utilizar um índice que sofra maior influência de empresas com ações de preço unitário mais elevado, mesmo que não sejam as maiores em termos de valor de mercado.",

                options: [

            {
                id: 16,
                temaId: 'tema4',
                contexto: "Gideão Diniz, profissional C-Pro I certificado pela Anbima que atua na área de investimentos, identificou que uma oferta pública de valores mobiliários distribuída pela Instituição Participante (IP) à qual está vinculado teve atraso de 40 dias no envio de informações obrigatórias à Anbima. Ele tinha uma reunião para orientar os gerentes de relacionamento da instituição a distribuir a oferta, porém decidiu adiar essa reunião e entrou em contato com a área de compliance do banco, pois primeiro precisava entender as consequências desse descumprimento e atraso.",

                ]
            },
            {
                id: 17,
                temaId: 'tema2',
                contexto: "Glória é uma profissional C-Pro I da área de Wealth Management de um grande banco de investimentos, que conta com experientes profissionais especialistas em ativos digitais, análise on-chain e estruturação de veículos de investimento. Foi solicitado que Glória montasse um relatório detalhado, apresentando a análise de alguns investimentos que pudessem ser utilizados na recomendação de montagem de carteiras de investidores qualificados.\nNa solicitação à Glória, foram destacados dois pontos: evitar volatilidade excessiva protegendo contra quedas, e explorar DeFi com renda passiva mitigando risco de contraparte.\nA análise macro apontou:\n- Taxas de juros globais em patamar elevado agora, mas com queda esperada nos EUA;\n- Adoção crescente de blockchain institucional;\n- Volatilidade implícita das criptos muito alta.\nInvestimentos em tela: ETFs de BTC/ETH, COEs, Stablecoins rendendo juros fora, Venture Capital, Cold Storage.",

                options: [
                    { text: "alocar a maior parte em stablecoins remuneradas via plataformas reguladas, complementando com ETFs de Bitcoin e Ethereum, e utilizar COEs com barreira de proteção.", isCorrect: true, gabarito: "Stablecoins não variam (não têm volatilidade como o Bitcoin), resolvendo o problema 1 (evitar volatilidade excessiva), e ao usar plataformas reguladas para gerar yields nelas, resolve a renda passiva DeFi mitigando o risco de contraparte. O COE com proteção garante um teto mínimo. E os ETFs de BTC/ETH permitem a exposição à alta de longo prazo (capturar retorno) em um ambiente regulado, sem os riscos complexos da Cold Storage." },

                    { text: "utilizar exclusivamente fundos de venture capital focados em blockchain, com prazo de resgate superior a 10 anos, sem nenhuma exposição direta ou líquida a criptoativos.", isCorrect: false }
                ]

            {
                id: 18,
                temaId: 'tema2',
                contexto: "Mesmo contexto do relatório de Glória em Wealth Management envolvendo Criptoativos.",

            {
                id: 19,
                temaId: 'tema2',
                contexto: "A empresa Delta, do setor de logística, pretende investir R$ 20 milhões em um FIDC de classe fechada no mercado primário, com chamada de capital. Preocupada com o fluxo de caixa, a diretoria quer entender como isso impacta a previsibilidade do retorno.",

                    { text: "desembolsará os recursos nas chamadas de integralização, e receberá seu capital em amortizações previstas.", isCorrect: true, gabarito: "A principal característica de um FIDC (Fundo de Direitos Creditórios) Classe Fechada 'com chamada de capital' é o descasamento entre Subscrição (assinar o cheque) e Integralização (pagar o cheque). A empresa subscreve os 20 milhões, mas o gestor do FIDC só vai pedir as transferências ('chamar o capital') conforme ele for achando recebíveis/boletos para o fundo comprar no mercado. O retorno do dinheiro investido ocorre à medida que esses boletos vencem e são pagos pelos devedores, gerando as 'amortizações' da cota." },
                    { text: "desembolsará os R$ 20 milhões no ato da subscrição, e poderá solicitar resgates sempre que precisar de liquidez.", isCorrect: false },

                    { text: "poderá desistir do investimento antes do vencimento, bastando não fazer novos aportes.", isCorrect: false }
                ]
            },
            {
                id: 20,
                temaId: 'tema1',
                contexto: "Ricardo é um profissional certificado Anbima que atua na área de análise de fundos listados em uma casa de análises independente. A diretoria dessa casa solicitou a ele que elaborasse um relatório sobre um Fundo de Investimento Imobiliário (FII) do segmento de lajes corporativas que apresentou aumento relevante no índice de vacância nos últimos 12 meses, saindo de 2% para 8% do portfólio. Esse fundo possui uma boa reserva de rendimentos retidos, além de 60% de contratos atípicos de longo prazo e 40% de contratos típicos de curta duração, cujos aluguéis vêm sendo renegociados com descontos de 5% a 10% devido ao desaquecimento do mercado de escritórios.",
                enunciado: "Diante desse contexto, em seu relatório, Ricardo deve:",
                options: [
                    { text: "avaliar o risco de concentração de inquilinos e a resiliência dos contratos atípicos, projetando cenários de vacância.", isCorrect: true, gabarito: "O FII de Lajes Corporativas de Ricardo tem o pilar do seu faturamento garantido pelos contratos Atípicos (que têm multas rescisórias astronômicas cobrindo todo o prazo restante, tornando a saída difícil). Já os Típicos são frágeis a vacância (rescisão é de apenas 3 meses de aviso em média). Logo, analisar a qualidade de quem são esses inquilinos atípicos (risco de concentração e de calote) é a melhor técnica para projetar os fluxos futuros." },
                    { text: "sugerir o investimento no respectivo fundo, argumentando que a vacância abriu uma oportunidade de entrada.", isCorrect: false },

                    { text: "inferir que a vacância não é um problema, devido aos contratos atípicos servirem de garantia contra a inadimplência.", isCorrect: false }
                ]
            },
            {
                id: 21,
                temaId: 'tema1',
                contexto: "Mesmo FII de Lajes Corporativas de Ricardo, com vacância subindo para 8% e renegociação em baixa dos contratos típicos (desconto de 5% a 10%).",
                enunciado: "Tendo em vista o contexto do mercado imobiliário, Ricardo avalia, em seu relatório, que os dividendos distribuídos pelo fundo devem sofrer:",

                    { text: "redução no curto prazo.", isCorrect: false },

            },
            {
                id: 22,
                temaId: 'tema2',
                contexto: "A equipe de profissionais certificados Anbima do banco de investimentos UBA está desenvolvendo diretrizes para a carteira recomendada de um novo fundo de ações globais. O objetivo é otimizar a diversificação internacional e a liquidez, incorporando ativos de mercados desenvolvidos e emergentes. Para isso, a equipe avalia a inclusão de BDRs de empresas americanas de tecnologia e ADRs de companhias brasileiras com forte presença global. Seu papel é analisar profundamente as estruturas e os níveis desses recibos depositários, considerando as exigências regulatórias da CVM e da SEC, os padrões de disclosure e as modalidades de negociação.",
                enunciado: "A decisão a ser tomada pela equipe de modo a refletir as diretrizes para a carteira recomendada deve:",
                options: [
                    { text: "incluir BDRs Nível II e III de empresas estrangeiras e ADRs de companhias brasileiras, garantindo transparência e liquidez compatíveis com o perfil do fundo.", isCorrect: true, gabarito: "A regulação (tanto da CVM quanto da SEC americana) é severa quanto aos Níveis de recibos. BDRs Nível I são 'não patrocinados', ou seja, um banco pegou as ações lá fora e empacotou aqui sem a empresa americana se comprometer a publicar balanços traduzidos, gerando baixa transparência. Já os Níveis II e III (tanto BDRs na B3 quanto ADRs na NYSE) são patrocinados pela empresa, exigem alto compliance e fornecem liquidez apropriada a investidores institucionais como Fundos de Ações Globais." },
                    { text: "priorizar BDRs Nível I não patrocinados de empresas estrangeiras com baixo disclosure, pois apresentam menor custo de aquisição e menor exigência regulatória.", isCorrect: false },
                    { text: "substituir ADRs de companhias brasileiras por ações locais, para eliminar exigências de registro na SEC e reduzir o controle de compliance internacional.", isCorrect: false },
                    { text: "adotar BDRs e ADRs de qualquer nível, pois todos possuem liquidez e exigências de registro equivalentes nos mercados brasileiro e americano.", isCorrect: false }
                ]
            },
            {
                id: 23,
                temaId: 'tema3',
                contexto: "Durante a revisão periódica da arquitetura de produtos previdenciários de uma corretora, a área técnica analisou os fundos disponíveis na oferta institucional. Verificou-se que fundos vinculados a planos distintos, com regulamentos próprios e gestores diferentes, mantinham exposição relevante a títulos privados emitidos por empresas de um mesmo conglomerado econômico. Tais posições resultaram de decisões independentes e estavam em conformidade com os limites de concentração por emissor e rating previstos nas normas. As análises individuais não indicaram desenquadramentos formais. Contudo, a discussão passou a considerar se a coerência da oferta deveria se restringir ao cumprimento individual dos limites ou incorporar a visão sobre a distribuição dos riscos subjacentes.",
                enunciado: "Considerando-se o contexto apresentado e o papel do C-Pro I na avaliação da coerência da oferta previdenciária, a interpretação tecnicamente mais consistente é que a:",
                options: [
                    { text: "análise da coerência da oferta pode requerer leitura agregada das exposições econômicas, ainda que os fundos sejam independentes.", isCorrect: true, gabarito: "A análise de risco de um C-Pro I não pode ser feita operando 'em silos'. Apesar de cada fundo previdenciário estar dentro do seu limite de risco de forma isolada, quando o portfólio do cliente (ou da corretora) é consolidado, descobre-se que a pessoa tem muito dinheiro alocado em dívida de um grupo econômico só (risco cruzado). A visão de risco moderna exige a consolidação e a 'leitura agregada' dos lastros de risco sistêmico." },
                    { text: "conformidade individual dos fundos com os limites regulatórios é suficiente para caracterizar a coerência da oferta distribuída.", isCorrect: false },
                    { text: "existência de gestores distintos e regulamentos próprios reduz a relevância da concentração identificada no nível da oferta institucional.", isCorrect: false },
                    { text: "ausência de desenquadramentos individuais indica que o risco de concentração não é material para a avaliação técnica da oferta.", isCorrect: false }
                ]
            },
            {
                id: 24,
                temaId: 'tema3',
                contexto: "Um plano PGBL está contratado na Distribuidora Deltum, com recursos no Fundo Deltum Ações, gerido por uma asset independente. Em um pedido de portabilidade para a Distribuidora Gold, foi solicitada a manutenção do fundo, já que a Gold oferece o fundo Gold Ações, com a mesma gestora e carteira idêntica. A solicitação baseia-se no entendimento de que bastaria trocar a distribuidora, mantendo o veículo de investimento inalterado devido à sua identidade operacional.",
                enunciado: "Considerando a estrutura contratual dos planos de previdência e o processo de portabilidade analisado, o entendimento correto do profissional C-Pro I é que o pedido não pode ser atendido porque:",
                options: [
                    { text: "o fundo está sendo confundido com o plano previdenciário, pois a portabilidade recai sobre o contrato regulado pela Susep, e não sobre o fundo vinculado.", isCorrect: true, gabarito: "Na Previdência Privada (PGBL/VGBL), a regulação da SUSEP rege que o investidor firma um contrato de Plano Previdenciário com a Seguradora. O fundo de investimento em si (FIF) é apenas onde a seguradora aloca as reservas para rentabilizar. Ao pedir portabilidade de um banco A para o banco B, você transfere o recurso do contrato da seguradora A para a seguradora B. Consequentemente, as cotas do fundo A são resgatadas em dinheiro, enviadas por TED para a seguradora B, que então aplica no fundo B. Não há 'transferência de cotas' do mesmo fundo entre bancos diferentes." },
                    { text: "a identidade de gestor e de carteira permite manter o mesmo fundo de investimento, ainda que a portabilidade ocorra apenas no nível do plano.", isCorrect: false },
                    { text: "a portabilidade deve permitir a transferência direta do fundo de investimento, com posterior vinculação formal ao novo plano de previdência.", isCorrect: false },
                    { text: "fundos com nomes e estratégias equivalentes são portáveis entre distribuidoras, independentemente da separação entre o plano e o fundo escolhido.", isCorrect: false }
                ]
            },
            {
                id: 25,
                temaId: 'tema4',
                contexto: "Durante a revisão da estratégia de distribuição de produtos de previdência, um profissional C-Pro I avalia três estratégias-modelo para planos de acumulação de longo prazo:\nEstratégia Alfa: 100% em renda fixa longa indexada ao IPCA\nEstratégia Beta: 60% renda fixa curta e 40% multimercados sem renda variável\nEstratégia Gama: 70% renda variável e 30% multimercados macro\nNos últimos cinco anos, Beta manteve retorno estável, Alfa teve perda real temporária e posterior recuperação, e Gama apresentou forte dispersão de retornos anuais, mas ganho real superior no acumulado.",
                enunciado: "Com base na análise dos resultados e da composição de risco, o profissional C-Pro I conclui que a coerência estrutural entre os três produtos reside em:",
                options: [
                    { text: "diferenças de comportamento intertemporal: Alfa sustenta o poder de compra no longo prazo, Beta reduz volatilidade cíclica e Gama pode ampliar retorno real.", isCorrect: true, gabarito: "Cada produto cumpre um papel atuaria na Previdência. O Alfa (IPCA+ longo) oscila no curto prazo pela marcação a mercado, mas a longo prazo protege a poupança perfeitamente contra a inflação. O Beta é voltado para controle absoluto de estômago do cliente (baixíssima volatilidade cíclica). O Gama assume enormes choques e quedas anuais dispersas em troca de uma explosão no ganho real lá no final. A coerência é que eles não concorrem, eles se complementam temporalmente dependendo da fase de vida do investidor." },
                    { text: "similaridade de propósito: todas as estratégias perseguem a mesma meta real de longo prazo e podem ser substituídas entre si sem perda de eficiência.", isCorrect: false },
                    { text: "convergência de riscos: a volatilidade de Gama e as perdas temporárias de Alfa indicam que ambas são equivalentes em termos de risco atuarial.", isCorrect: false },
                    { text: "divergência de horizonte: Alfa é adequada apenas para horizontes inferiores a cinco anos, enquanto Gama e Beta se destinam a prazos superiores a dez anos.", isCorrect: false }
                ]
            },
            {
                id: 26,
                temaId: 'tema3',
                contexto: "Caetano, profissional C-Pro I, ficou responsável por elaborar um material explicando a classificação de cada fundo para os profissionais que irão distribuí-los.\nAs informações dos fundos recebidas por Caetano foram:\nFundo Alfa: Manterá ao menos 75% do patrimônio líquido em ativos de renda variável, permitindo flexibilidade no percentual restante.\nFundo Beta: Manterá entre 15% e 30% do patrimônio líquido em ativos de renda variável e o restante em renda fixa com duration máxima de 4 anos.",
                enunciado: "Caetano deve explicar no material elaborado que os fundos de previdência Alpha e Beta são respectivamente, um fundo:",
                options: [
                    { text: "de ações, pois investe mais que o mínimo regulatório em renda variável, e um fundo balanceado, pois define as faixas de investimento entre renda variável e renda fixa.", isCorrect: true, gabarito: "De acordo com a classificação de Fundos Previdenciários da ANBIMA, fundos que garantem investir sistematicamente um mínimo elevado em bolsa (ex: no mínimo 67% segundo a CVM/ANBIMA, aqui Alfa usou o critério de 75%) são inquestionavelmente classificados como 'Fundos de Ações'. Já os fundos 'Balanceados' são aqueles que explicitam no mandato bandas fixas ou flexíveis de alocação de risco (ex: entre 15% a 30% em bolsa, e o resto em CDI/Renda Fixa, caso do fundo Beta)." },
                    { text: "de ações, pois investe a maior parte do patrimônio líquido em renda variável, e um fundo multimercado, pois investe em renda fixa e variável.", isCorrect: false },
                    { text: "multimercado, pois investe em diferentes classes de ativos, e um fundo de renda fixa, pois a maior parte do seu patrimônio, ao menos 70%, estará nesse ativo.", isCorrect: false },
                    { text: "multimercado, pois tem flexibilidade de investir em diferentes ativos, e um fundo de ações, pois estabelece a faixa que deve ser investida em renda variável.", isCorrect: false }
                ]
            },
            {
                id: 27,
                temaId: 'tema4',
                contexto: "Luís, profissional certificado C-Pro I, atua na área de Estratégia de Produtos de uma instituição financeira e é responsável por definir diretrizes técnicas que orientam a atuação dos profissionais de distribuição. Em uma revisão das carteiras previdenciárias recomendadas, ele analisa um relatório consolidado com dados dos últimos 36 meses de quatro fundos previdenciários.\n- Fundo P: 92% em títulos públicos e privados indexados ao CDI e IPCA, volatilidade de 2,1%;\n- Fundo Q: 48% RF, 32% Renda Variável, 15% derivativos e 5% exterior, volatilidade de 9,4%;\n- Fundo R: 75% RF e 25% Renda Variável, volatilidade de 6,8%;\n- Fundo S: 87% em ações, volatilidade de 18,6%.",
                enunciado: "Com base nas informações apresentadas, Luís deve:",
                options: [
                    { text: "estabelecer o Fundo P como base das carteiras e direcionar o Fundo S exclusivamente a clientes com maior tolerância ao risco.", isCorrect: true, gabarito: "O Fundo P é o alicerce clássico de alocação conservadora (base de carteira core) por atuar com caixa/liquidez indexada (CDI/IPCA) com apenas 2,1% de volatilidade. O fundo S atua como pimenta da carteira (direcional, quase 90% em bolsa e vol. alta perto dos 19%), logo não serve como fundo base para aposentadoria geral de conservadores, sendo focado exclusivamente para perfis agressivos ou alocações táticas mínimas." },
                    { text: "estipular o uso simultâneo dos Fundos P e S, assumindo que a combinação entre baixa e alta volatilidade neutraliza o risco.", isCorrect: false },
                    { text: "determinar a substituição do Fundo P pelo R nas carteiras conservadoras, pois o rebalanceamento periódico mitiga o risco.", isCorrect: false },
                    { text: "definir o Fundo Q como elemento-chave das carteiras, devido a sua diversificação, que é suficiente para diferentes perfis de risco.", isCorrect: false }
                ]
            },
            {
                id: 28,
                temaId: 'tema3',
                contexto: "O profissional certificado Anbima deve reconhecer que o risco de sequência de retornos pode afetar de forma crítica a fase de desacumulação. Quedas significativas nos primeiros anos, ainda que seguidas de recuperação, tendem a comprometer o patrimônio e reduzir a sustentabilidade das retiradas mensais. Por isso, a estratégia e análise para confecção de carteiras deve contemplar mecanismos de proteção que preservem o fluxo de renda no longo prazo.",

        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

                const preparedQuestions = rawQuizData.map(q => {
                    const correctOption = q.options.find(o => o.isCorrect);
                    const gabaritoText = correctOption ? correctOption.gabarito : "";
                    
                    return {
                        ...q,
                        options: shuffleArray(q.options),
                        gabaritoText: gabaritoText
                    };
                });
                setQuizQuestions(shuffleArray(preparedQuestions));
            }, [view === 'home']); // Reshuffle toda vez que volta pro home

                setStudyTarget(temaId);
                setView('study');
            };

        };

        const HomeView = ({ setView }) => (
            <div className="fade-in flex flex-col items-center justify-center py-6 md:py-12">
                <div className="bg-white p-8 md:p-12 rounded-3xl shadow-lg border border-slate-100 max-w-3xl w-full text-center">
                    <div className="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6">
                        <span className="text-4xl">🏆</span>
                    </div>
                    <h2 className="text-3xl md:text-4xl font-black text-slate-800 mb-4 tracking-tight">Especialista C-Pro I ANBIMA</h2>
                    <p className="text-slate-600 mb-10 text-lg md:text-xl font-medium leading-relaxed">
                        Prepare-se de forma profunda. Material destrinchado dos 4 Macrotemas focados na análise de portfólios, e o simulado oficial interativo.
                    </p>
                    <div className="grid md:grid-cols-2 gap-6 w-full">
                        <button onClick={() => setView('study')} className="group flex flex-col items-center justify-center p-8 bg-slate-50 rounded-2xl border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50 hover:shadow-md transition-all duration-300">
                            <span className="text-5xl mb-4 group-hover:-translate-y-2 transition-transform duration-300">📚</span>
                            <span className="font-extrabold text-slate-800 text-xl mb-2">Material Profundo</span>
                            <span className="text-sm text-slate-500 font-medium text-center">Gestão de Risco, PGBL/VGBL, Offshores, CAPM e CVM 175.</span>
                        </button>
                        <button onClick={() => setView('quiz')} className="group flex flex-col items-center justify-center p-8 bg-slate-50 rounded-2xl border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50 hover:shadow-md transition-all duration-300">
                            <span className="text-5xl mb-4 group-hover:-translate-y-2 transition-transform duration-300">🎯</span>
                            <span className="font-extrabold text-slate-800 text-xl mb-2">Simulado Completo</span>
                            <span className="text-sm text-slate-500 font-medium text-center">39 Questões Explicadas e Alternativas Embaralhadas.</span>
                        </button>
                    </div>
                </div>
            </div>
        );

        const StudyView = ({ studyTarget, setStudyTarget }) => {
            
            // Effect para scrollar suavemente se viemos de um erro do simulado
            React.useEffect(() => {
                if (studyTarget) {
                    const el = document.getElementById(studyTarget);
                    if (el) {
                        setTimeout(() => {
                            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            setStudyTarget(null); // Reseta após scroll
                        }, 100);
                    }
                }
            }, [studyTarget]);

            return (
                <div className="fade-in max-w-4xl mx-auto">
                    <div className="flex items-center gap-4 mb-8">
                        <div className="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center text-2xl">📖</div>
                        <h2 className="text-3xl md:text-4xl font-black text-slate-800 tracking-tight">Conteúdo Programático</h2>
                    </div>
                    
                    <div className="space-y-8">
                        {studyData.map((item) => (
                            <div key={item.id} id={item.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden transition-shadow hover:shadow-md">
                                <div className="bg-slate-800 px-6 py-5 border-b-4 border-emerald-500">
                                    <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                        <svg className="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        {item.title}
                                    </h3>
                                </div>
                                <div className="p-6 md:p-8 text-slate-700 markdown-content" dangerouslySetInnerHTML={{
                                    // Utilizando regex simples para transformar o pseudo-markdown em tags visuais
                                    __html: item.content
                                        .replace(/\n\n/g, '<br><br>')
                                        .replace(/### (.*?)(\n|<br>)/g, '<h3 class="text-xl font-extrabold text-slate-800 mt-6 mb-3 pb-2 border-b border-slate-100">$1</h3>')
                                        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                                        .replace(/\* (.*?)(<br>|\n)/g, '<li class="ml-4 mb-2 relative pl-2 before:content-[\'•\'] before:absolute before:left-[-15px] before:text-emerald-500 before:font-bold">$1</li>')
                                }}>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const QuizView = ({ questions, setView, navigateToStudy }) => {
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [selectedOption, setSelectedOption] = React.useState(null);
            const [hasAnswered, setHasAnswered] = React.useState(false);
            const [score, setScore] = React.useState(0);
            const [quizFinished, setQuizFinished] = React.useState(false);

            if (questions.length === 0) return <div className="text-center py-20 text-xl font-bold text-slate-500">Carregando simulado...</div>;

            const q = questions[currentIndex];

            const handleOptionClick = (option) => {
                if (hasAnswered) return;
                setSelectedOption(option);
                setHasAnswered(true);
                if (option.isCorrect) {
                    setScore(prev => prev + 1);
                }
            };

            const handleNext = () => {
                if (currentIndex < questions.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                    setSelectedOption(null);
                    setHasAnswered(false);
                } else {
                    setQuizFinished(true);
                }
            };

            if (quizFinished) {
                const pass = score >= Math.ceil(questions.length * 0.7);
                return (
                    <div className="fade-in bg-white p-8 md:p-12 rounded-3xl shadow-xl border border-slate-100 text-center max-w-2xl mx-auto mt-10">
                        <div className={`w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 ${pass ? 'bg-emerald-100' : 'bg-rose-100'}`}>
                            <span className="text-5xl">{pass ? '🎉' : '⚠️'}</span>
                        </div>
                        <h2 className="text-3xl font-black text-slate-800 mb-2">Simulado Concluído</h2>
                        <h3 className={`text-xl font-bold mb-6 ${pass ? 'text-emerald-600' : 'text-rose-600'}`}>
                            {pass ? "Aprovado!" : "Reprovado - Exige 70%"}
                        </h3>
                        
                        <div className="bg-slate-50 p-6 rounded-2xl mb-8 border border-slate-200">
                            <p className="text-lg text-slate-600 font-medium mb-1">Seu resultado oficial:</p>
                            <p className="text-5xl font-extrabold text-slate-800 mb-2">{score} <span className="text-2xl text-slate-500">/ {questions.length}</span></p>
                            <div className="w-full bg-slate-200 rounded-full h-3 mb-2 overflow-hidden mt-4">
                                <div className={`h-3 rounded-full transition-all duration-1000 ${pass ? 'bg-emerald-500' : 'bg-rose-500'}`} style={{ width: `${(score / questions.length) * 100}%` }}></div>
                            </div>
                            <p className="text-sm font-bold text-slate-500">{Math.round((score / questions.length) * 100)}% de aproveitamento</p>
                        </div>
                        
                        <div className="flex flex-col sm:flex-row justify-center gap-4">
                            <button 
                                onClick={() => {
                                    setCurrentIndex(0);
                                    setScore(0);
                                    setQuizFinished(false);
                                    setHasAnswered(false);
                                    setSelectedOption(null);
                                    // Para um restart perfeito, os dados precisariam ser re-embaralhados no parent,
                                    // mas por simplicidade recomeçamos do inicio do array mixado atual
                                }} 
                                className="bg-emerald-700 text-white font-bold py-4 px-8 rounded-xl hover:bg-emerald-800 transition shadow-md w-full sm:w-auto">
                                Refazer Simulado
                            </button>
                            <button 
                                onClick={() => setView('study')} 
                                className="bg-slate-200 text-slate-800 font-bold py-4 px-8 rounded-xl hover:bg-slate-300 transition w-full sm:w-auto">
                                Voltar aos Estudos
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="fade-in max-w-3xl mx-auto">
                    {/* Barra de Progresso Superior */}
                    <div className="mb-8">
                        <div className="flex justify-between items-end mb-2">
                            <div>
                                <span className="text-sm font-bold text-slate-400 uppercase tracking-widest">Progresso</span>
                                <div className="text-2xl font-black text-slate-800">
                                    {currentIndex + 1} <span className="text-lg text-slate-400">/ {questions.length}</span>
                                </div>
                            </div>
                            <div className="text-right">
                                <span className="text-sm font-bold text-slate-400 uppercase tracking-widest">Score</span>
                                <div className="text-2xl font-black text-emerald-600">{score}</div>
                            </div>
                        </div>
                        <div className="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                            <div className="bg-emerald-500 h-2.5 rounded-full transition-all duration-500 ease-out" style={{ width: `${((currentIndex) / questions.length) * 100}%` }}></div>
                        </div>
                    </div>

                    <div className="bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden mb-12">
                        {/* Area da Pergunta */}
                        <div className="p-6 md:p-10 bg-slate-800 text-white">
                            {q.contexto && (
                                <div className="mb-6 bg-slate-700/50 p-5 rounded-2xl border border-slate-600">
                                    <div className="flex items-center gap-2 mb-3">
                                        <svg className="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider">Contexto do Caso</span>
                                    </div>
                                    <p className="text-slate-300 text-sm md:text-base leading-relaxed text-justify whitespace-pre-wrap">{q.contexto}</p>
                                </div>
                            )}
                            <h3 className="text-lg md:text-xl font-bold leading-relaxed">{q.enunciado}</h3>
                        </div>

                        {/* Botões de Alternativas */}
                        <div className="p-6 md:p-10 space-y-4 bg-white">
                            {q.options.map((opt, i) => {
                                let btnClass = "w-full text-left p-5 rounded-2xl border-2 transition-all duration-300 relative overflow-hidden ";
                                
                                if (!hasAnswered) {
                                    btnClass += "border-slate-200 hover:border-emerald-500 hover:shadow-md bg-white text-slate-700 cursor-pointer hover:bg-slate-50";
                                } else {
                                    if (opt.isCorrect) {
                                        btnClass += "border-emerald-500 bg-emerald-50/50 text-emerald-900 font-medium ring-1 ring-emerald-500 shadow-sm z-10";
                                    } else if (selectedOption === opt && !opt.isCorrect) {
                                        btnClass += "border-rose-500 bg-rose-50/50 text-rose-900 font-medium ring-1 ring-rose-500 z-10";
                                    } else {
                                        btnClass += "border-slate-100 bg-white text-slate-400 opacity-50 cursor-not-allowed scale-95";
                                    }
                                }

                                return (
                                    <button 
                                        key={i} 
                                        disabled={hasAnswered}
                                        onClick={() => handleOptionClick(opt)}
                                        className={btnClass}
                                    >
                                        <div className="flex items-start gap-4">
                                            <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 font-bold text-sm transition-colors ${hasAnswered && opt.isCorrect ? 'bg-emerald-500 text-white' : hasAnswered && selectedOption === opt && !opt.isCorrect ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-500'}`}>
                                                {String.fromCharCode(65 + i)}
                                            </div>
                                            <span className="pt-1 text-sm md:text-base leading-snug">{opt.text}</span>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>

                        {/* Feedback Area (Aparece ao responder) */}
                        {hasAnswered && (
                            <div className={`p-6 md:p-10 border-t-4 fade-in ${selectedOption?.isCorrect ? 'bg-emerald-50 border-emerald-500' : 'bg-rose-50 border-rose-500'}`}>
                                <div className="flex items-center gap-3 mb-4">
                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center text-white ${selectedOption?.isCorrect ? 'bg-emerald-500' : 'bg-rose-500'}`}>
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            {selectedOption?.isCorrect 
                                                ? <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path>
                                                : <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M6 18L18 6M6 6l12 12"></path>
                                            }
                                        </svg>
                                    </div>
                                    <h4 className={`text-2xl font-black ${selectedOption?.isCorrect ? 'text-emerald-800' : 'text-rose-800'}`}>
                                        {selectedOption?.isCorrect ? 'Exatamente!' : 'Resposta Incorreta'}
                                    </h4>
                                </div>
                                
                                {!selectedOption?.isCorrect && (
                                    <div className="mb-4 p-4 bg-white rounded-xl border border-rose-200">
                                        <p className="text-sm font-bold text-rose-800 mb-1 uppercase tracking-wider">Por que a sua escolha está errada?</p>
                                        <p className="text-slate-700 text-sm leading-relaxed">
                                            A alternativa que você marcou contraria as regulamentações e métricas atuariais descritas nos manuais. Leia abaixo a justificativa do gabarito oficial para entender a regra correta aplicada a este caso pela ANBIMA.
                                        </p>
                                    </div>
                                )}

                                <div className={`p-5 rounded-2xl bg-white border shadow-sm text-sm md:text-base leading-relaxed ${selectedOption?.isCorrect ? 'text-emerald-900 border-emerald-200' : 'text-slate-800 border-slate-200'}`}>
                                    <span className={`font-bold block mb-2 uppercase tracking-widest text-xs ${selectedOption?.isCorrect ? 'text-emerald-600' : 'text-slate-500'}`}>Gabarito Oficial Explicado</span>
                                    {q.gabaritoText}
                                </div>
                                
                                <div className="mt-8 flex flex-col md:flex-row items-center justify-between gap-4">
                                    {!selectedOption?.isCorrect ? (
                                        <button 
                                            onClick={() => navigateToStudy(q.temaId)}
                                            className="text-rose-600 font-bold hover:text-rose-800 hover:bg-rose-100 py-2 px-4 rounded-lg transition-colors flex items-center gap-2"
                                        >
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                            Revisar no Material de Apoio
                                        </button>
                                    ) : (<div></div>)}
                                    
                                    <button 
                                        onClick={handleNext}
                                        className="w-full md:w-auto bg-slate-800 text-white font-bold py-3 px-8 rounded-xl hover:bg-slate-700 transition-colors shadow-md flex items-center justify-center gap-2"
                                    >
                                        {currentIndex < questions.length - 1 ? 'Avançar' : 'Finalizar e Ver Nota'}
                                        {currentIndex < questions.length - 1 && <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
